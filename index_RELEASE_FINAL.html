    :root { --gold: #f6d65c; --cream: #f5ead2; }
    * { box-sizing: border-box; }
    /* 1920px sind die Referenzbreite des Designs.
       Auf 16:9-Monitoren nutzt die Seite die gesamte Browserbreite – auch wenn
       die Browserleisten die sichtbare Höhe etwas verringern.
       Auf Ultrawide-Monitoren bleibt der sichtbare Bereich auf 16:9 begrenzt. */
    html {
      width: 100%; height: 100%; margin: 0;
      overflow: hidden; overscroll-behavior: none;
      background: #100c0a;
    }
    body {
      position: absolute;
      top: 50%; left: 50%;
      margin: 0;
      width: 1920px; height: var(--site-design-height, 1080px);
      min-width: 0; min-height: 0;
      transform: translate(-50%, -50%) scale(var(--site-scale, 1));
      transform-origin: center center;
      overflow: hidden; overscroll-behavior: none;
      color: var(--cream);
      font-family: "Cinzel Vorlage", Georgia, serif;
      font-weight: 900;
      text-shadow: 0 0 5px rgba(255,215,85,.38), 0 0 12px rgba(255,199,53,.18);
      background:
        linear-gradient(rgba(20,15,12,.38), rgba(20,15,12,.68)),
        url("Bilder/Hintergrund_1.png") center center / cover no-repeat;
      background-color: #29201b;
      display: flex; flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      text-align: center;
      padding: 43.2px 1rem 21.6px;
    }
    .music-toggle {
      position: fixed; top: 1rem; left: 1rem; z-index: 10;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem;
      padding: .55rem .8rem; color: var(--cream);
      font: inherit; font-size: .95rem; letter-spacing: .08em;
      background: rgba(25,19,15,.82); border: 1px solid rgba(246,214,92,.65);
      border-radius: 3px; cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,.3);
    }
    .music-toggle:hover, .music-toggle:focus-visible {
      border-color: var(--gold); box-shadow: 0 0 12px rgba(246,214,92,.45); outline: none;
    }
    .music-toggle img { display: block; width: 72px; height: 72px; object-fit: contain; }
    .eyebrow {
      margin: 0 0 .9rem; font-size: .85rem; letter-spacing: .32em;
      text-transform: none; color: var(--gold);
    }
    h1 {
      margin: 0 auto; max-width: 1100px;
      font-size: 5.2rem; line-height: 1.05;
      font-weight: 900; letter-spacing: .055em; text-transform: none;
      color: #ffe600; text-shadow: 0 0 5px rgba(255,230,40,.95), 0 0 13px rgba(255,205,0,.72), 0 0 21px rgba(255,171,0,.40), 0 3px 12px rgba(0,0,0,.8);
    }
    /* Schlichteres römisches E statt der stark verzierten Initiale. */
    h1 .erinnerungen-word { white-space: nowrap; }
    h1 .initial-e { display: inline; font-size: 1.08em; line-height: inherit; vertical-align: baseline; }
    .ornament {
      width: 260px; height: 1px; margin: 1.7rem auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    main {
      width: min(1400px, 94%);
      flex: 1 1 auto; min-height: 0;
      margin: 0 auto;
      padding: 10.8px 0 19.2px;
      display: flex; align-items: center;
    }
    .cards {
      position: relative;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      width: 100%; height: min(100%, 540px);
      align-items: stretch; gap: 1.2rem;
    }
    .card {
      display: flex; align-items: center; justify-content: center;
      min-width: 0; min-height: 0; padding: .45rem;
      background: rgba(25,19,15,.52); border: 1px solid rgba(245,234,210,.35);
      border-radius: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
      backdrop-filter: blur(3px);
    }
    .card img { display: block; width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
    a.card { text-decoration: none; cursor: pointer; }
    .card:hover, .card:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 8px var(--gold), 0 0 22px rgba(246,214,92,.78),
                  inset 0 0 12px rgba(246,214,92,.12);
      transform: translateY(-5px); outline: none;
    }
    .inactive { cursor: default; }
    .card-wrap {
      min-width: 0; min-height: 0;
      display: flex;
    }
    .card-wrap .card { width: 100%; }
    .veil {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(246, 214, 92, .55);
      border-radius: 3px;
      color: #f8e9bd;
      font-family: "Cinzel Vorlage", Georgia, serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: .16em;
      text-transform: none;
      cursor: pointer;
      background:
        linear-gradient(135deg, rgba(24, 18, 14, .84), rgba(71, 52, 33, .76)),
        repeating-linear-gradient(45deg, rgba(246,214,92,.05) 0 2px, transparent 2px 8px);
      box-shadow: inset 0 0 28px rgba(0,0,0,.35);
      backdrop-filter: blur(5px);
      transition: opacity .55s ease, visibility .55s ease, box-shadow .25s ease;
      z-index: 2;
    }
    .veil span {
      padding: .75rem 1rem;
      border-top: 1px solid rgba(246,214,92,.7);
      border-bottom: 1px solid rgba(246,214,92,.7);
      text-shadow: 0 0 12px rgba(246,214,92,.55);
    }
    .veil:hover, .veil:focus-visible {
      box-shadow: inset 0 0 30px rgba(246,214,92,.15), 0 0 14px rgba(246,214,92,.35);
      outline: 1px solid var(--gold);
      outline-offset: -5px;
    }
    .cards.unveiled .veil {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .cinema-link {
      position: fixed; top: 1rem; right: 1rem; z-index: 10;
      display: inline-flex; flex-direction: column; align-items: center; gap: .3rem;
      padding: .5rem .75rem; color: var(--cream); text-decoration: none;
      font: inherit; font-size: .85rem; letter-spacing: .05em;
      background: rgba(25,19,15,.82); border: 1px solid rgba(246,214,92,.65);
      border-radius: 3px; box-shadow: 0 3px 12px rgba(0,0,0,.3);
    }
    .cinema-link img { display: block; width: 180px; height: auto; object-fit: contain; }
    .cinema-link:hover, .cinema-link:focus-visible {
      border-color: var(--gold); box-shadow: 0 0 12px rgba(246,214,92,.45); outline: none;
    }
  </style>
</head>
<body>
  <a class="cinema-link" href="https://www.youtube.com/@schoneinkleinesbisschencut" target="_blank" rel="noopener noreferrer" aria-label="Großes Kino auf YouTube öffnen (neuer Tab)">
    <img src="Bilder/Cinema.png" alt="Cinema">
    <span>Großes Kino</span>
  </a>

  <button class="music-toggle" id="music-toggle" type="button" aria-label="Musik ausschalten" aria-pressed="false">
    <img id="music-icon" src="Bilder/sound-on.png" alt="">
    <span>Musik</span>
  </button>
  <audio id="background-music" autoplay loop>
    <source src="Sound/Musik.mp3" type="audio/mpeg">
    Dein Browser unterstützt keine Hintergrundmusik.
  </audio>
  <header>
    <p class="eyebrow">Ein Ort voller Geschichten</p>
    <h1 aria-label="Moiras Haus der Erinnerungen">Moiras Haus der <span class="erinnerungen-word" aria-hidden="true"><span class="initial-e">e</span>rinnerungen</span></h1>
    <div class="ornament" aria-hidden="true"></div>
  </header>
  <main>
    <nav class="cards" aria-label="Erinnerungskarten">
      <div class="card-wrap">
        <a class="card" href="https://agrandi123.github.io/Kartenlegerin1/" aria-label="Karte 1 öffnen">
          <img src="Bilder/Karte1.png" alt="Karte 1">
        </a>
      </div>
      <div class="card-wrap">
        <a class="card" href="https://agrandi123.github.io/Kartenlegerin2/" aria-label="Karte 2 öffnen">
          <img src="Bilder/Karte2.png" alt="Karte 2">
        </a>
      </div>
      <div class="card-wrap">
        <div class="card inactive" aria-label="Karte 3, ohne Verlinkung">
          <img src="Bilder/Karte3.png" alt="Karte 3">
        </div>
      </div>
      <div class="card-wrap">
        <a class="card" href="https://agrandi123.github.io/schluesselmomente/" aria-label="Karte 4 öffnen">
          <img src="Bilder/Karte4.png" alt="Karte 4">
        </a>
      </div>
      <button class="veil" type="button" aria-label="Schleier über allen vier Karten entfernen"><span>Tritt ein</span></button>
    </nav>
  </main>
  <script>
    // Full HD (1920 x 1080) ist die Ausgangsgröße.
    // Wichtig: Die Browserleiste verkleinert die INNERE Fensterhöhe.
    // Darum darf bei 16:9-Monitoren nicht allein aus der Innenhöhe skaliert
    // werden – sonst entstehen trotz Full-HD-Bildschirm seitliche Balken.
    (function () {
      function scaleWebsite() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const screenRatio = Math.max(screen.width, screen.height) /
                            Math.min(screen.width, screen.height);
        const viewportRatio = viewportWidth / viewportHeight;
        // Ultrawide-Bildschirm bzw. ungewöhnlich breites Browserfenster:
        // den 16:9-Inhalt zentriert mit Balken links/rechts anzeigen.
        const isUltrawide = screenRatio > 2.0 || viewportRatio > 2.35;
        const contentWidth = isUltrawide
          ? Math.min(viewportWidth, viewportHeight * 16 / 9)
          : viewportWidth;
        const scale = contentWidth / 1920;
        // Die Seitenhöhe passt sich dem verfügbaren Browserbereich an.
        // So bleibt auf Full-HD-Bildschirmen alles sichtbar und breitenfüllend.
        const designHeight = viewportHeight / scale;
        document.body.style.setProperty("--site-scale", String(scale));
        document.body.style.setProperty("--site-design-height", designHeight + "px");
      }
      scaleWebsite();
      window.addEventListener("resize", scaleWebsite, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scaleWebsite, { passive: true });
      }
    })();
  </script>
  <script>
    // Manche Browser blockieren automatisches Abspielen mit Ton.
    // Bei der ersten Nutzerinteraktion wird die Musik erneut gestartet.
    (function () {
      const music = document.getElementById("background-music");
      const toggle = document.getElementById("music-toggle");
      const icon = document.getElementById("music-icon");
      let musicDisabledByUser = false;
      music.volume = 0.18;

      function updateMusicButton(isOn) {
        icon.src = isOn ? "Bilder/sound-on.png" : "Bilder/sound-off.png";
        toggle.setAttribute("aria-label", isOn ? "Musik ausschalten" : "Musik einschalten");
        toggle.setAttribute("aria-pressed", String(!isOn));
      }

      function tryPlayMusic() {
        if (!musicDisabledByUser) music.play().catch(function () {});
      }

      toggle.addEventListener("click", function () {
        if (music.paused || musicDisabledByUser) {
          musicDisabledByUser = false;
          tryPlayMusic();
          updateMusicButton(true);
        } else {
          musicDisabledByUser = true;
          music.pause();
          updateMusicButton(false);
        }
      });

      tryPlayMusic();
      document.addEventListener("pointerdown", tryPlayMusic);
      document.addEventListener("keydown", tryPlayMusic);
    })();
  </script>

  <script>
    const cards = document.querySelector(".cards");
    const veil = document.querySelector(".veil");
    veil.addEventListener("click", function () {
      cards.classList.add("unveiled");
    });
  </script>
</body>
</html>
